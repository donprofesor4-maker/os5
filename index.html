// Evalúa la palabra solicitada sin penalizar acentos, mayúsculas o faltas pequeñas.
function practiceMatch(value,target){
 const words=s=>normalize(s??'').replace(/\.(svg|txt|aula)$/,'').match(/[a-z0-9]+/g)||[];
 const a=words(value),b=words(target);if(!a.length||a.length!==b.length)return false;
 return b.every((word,i)=>{
  const actual=a[i];if(actual===word)return true;
  if(/\d/.test(word)||/\d/.test(actual))return false;
  const limit=word.length<4?0:word.length<5?1:2;
  if(Math.abs(actual.length-word.length)>limit)return false;
  const rows=Array.from({length:actual.length+1},(_,r)=>Array.from({length:word.length+1},(_,c)=>r===0?c:c===0?r:0));
  for(let r=1;r<=actual.length;r++)for(let c=1;c<=word.length;c++){
   rows[r][c]=Math.min(rows[r-1][c]+1,rows[r][c-1]+1,rows[r-1][c-1]+(actual[r-1]===word[c-1]?0:1));
   if(r>1&&c>1&&actual[r-1]===word[c-2]&&actual[r-2]===word[c-1])rows[r][c]=Math.min(rows[r][c],rows[r-2][c-2]+1);
  }
  return rows[actual.length][word.length]<=limit;
 });
}

function check(){if(recovering)return;let advanced=false;while(stage<missions.length&&missions[stage].test()){stage++;startTick=tick;missionStarts[stage]=snapshot();advanced=true;}if(advanced)notify(stage===missions.length?'¡Excelente! Completaste tu proyecto.':'¡Bien hecho! Continúa con la siguiente misión.');renderMission();}

  $('#windows').replaceChildren();document.querySelectorAll('.ppt-player').forEach(el=>el.remove());
  $('#dialog').hidden=true;$('#context').hidden=true;$('#start').hidden=true;clip=null;selected=null;selectedParent=null;

}

function dialog(title,initial,callback,confirmOnly=false){const d=$('#dialog');d.hidden=false;d.innerHTML='<form class="dialogbox"><h2></h2><input aria-label="Nombre" autocomplete="off"><div class="actions"><button type="button">Cancelar</button><button class="primary">'+(confirmOnly?'Confirmar':'Guardar')+'</button></div></form>';d.querySelector('h2').textContent=title;const input=d.querySelector('input');input.value=initial;input.hidden=confirmOnly;d.querySelector('button').onclick=()=>d.hidden=true;d.querySelector('form').onsubmit=e=>{e.preventDefault();const val=input.value.trim();if(!confirmOnly&&!val)return;d.hidden=true;callback(val)};if(confirmOnly)d.querySelector('.primary').focus();else{input.focus();input.select()}}

function openWindow(title,w=660,h=440){const el=document.createElement('section');el.className='window';const top=workspaceTop();el.style.cssText=`width:${Math.min(w,innerWidth-20)}px;height:${Math.max(100,Math.min(h,innerHeight-top-70))}px;left:${Math.max(10,(innerWidth-Math.min(w,innerWidth-20))/2)}px;top:${top}px;z-index:${++winZ}`;el.innerHTML='<div class="titlebar"><strong></strong><button title="Minimizar" aria-label="Minimizar">−</button><button class="close" title="Cerrar" aria-label="Cerrar">×</button></div><div class="content"></div>';el.querySelector('strong').textContent=title;$('#windows').append(el);el.dataset.app=title.startsWith('Explorador')?'files':title.startsWith('Navegador')?'browser':title.startsWith('Bloc')?'note':title.startsWith('Presentaciones')?'slides':'other';el.onpointerdown=()=>{el.style.zIndex=++winZ;updateTaskbar()};el.querySelector('.close').onclick=()=>{el.remove();updateTaskbar()};el.querySelector('button').onclick=()=>{el.hidden=true;updateTaskbar()};updateTaskbar();const bar=el.querySelector('.titlebar');let drag=null;bar.onpointerdown=e=>{if(e.target.closest('button'))return;drag={x:e.clientX-el.offsetLeft,y:e.clientY-el.offsetTop};bar.setPointerCapture(e.pointerId)};bar.onpointermove=e=>{if(drag){el.style.left=Math.max(8,Math.min(innerWidth-el.offsetWidth-8,e.clientX-drag.x))+'px';el.style.top=Math.max(workspaceTop(),Math.min(innerHeight-el.offsetHeight-70,e.clientY-drag.y))+'px'}};bar.onpointerup=bar.onpointercancel=()=>drag=null;return {el,body:el.querySelector('.content')}}

function transferAllowed(f,cut,parent){const task=missions[stage];if(!task?.transfer)return true;const required=task.transfer==='cut';if([4,5].includes(stage)&&f.parent!=='pictures'){showMissing('Primero abre Imágenes con DOBLE CLIC y selecciona allí el archivo original.');return false;}if(cut!==required){showMissing('Este paso pide '+(required?'CORTAR para mover el archivo.':'COPIAR para conservar el original.')+' Vuelve a seleccionarlo con clic derecho.');return false;}if(task.fileName?!practiceMatch(f.name,task.fileName):!task.allowed.includes(f.art)){showMissing();return false;}if(parent&&parent!==task.target()){showMissing('Todavía no estás DENTRO de la carpeta correcta. Usa la flecha ← para volver y abre cada carpeta con DOBLE CLIC. La ruta debe decir '+path(task.target())+'. Solo entonces pulsa Pegar.');return false;}return true;}

function saveImageTo(img,parent,name){
  name=name.trim();if(!name)return notify('Escribe el nombre del archivo.');
  if(!name.toLowerCase().endsWith('.svg'))name+='.svg';
  if(children(parent).some(x=>x.name===name||x.art===img.id)){notify('Esta imagen ya está en esa carpeta.');return false;}
  add(name,'image',parent,{art:img.id});record('download',{art:img.id,site:img.site,parent});refreshFiles();
  notify(parent==='pictures'?'Imagen guardada en Imágenes.':'Imagen guardada. La misión pide Imágenes.');return true;
}
function download(img){
  const overlay=$('#dialog');overlay.hidden=false;
  overlay.innerHTML='<form class="save-dialog" role="dialog" aria-modal="true" aria-label="Guardar imagen como"><div class="save-title">Guardar imagen como…</div><div class="toolbar"><button type="button" class="save-back" aria-label="Subir a carpeta anterior">↑</button><span class="path"></span></div><div class="save-main"><aside><button type="button" class="save-home">Escritorio</button></aside><div class="save-list files" aria-label="Carpetas y archivos"></div></div><div class="save-bottom"><label>Nombre del archivo<input aria-label="Nombre del archivo" class="save-name"></label><p class="hint">Tipo: imagen SVG · Abre las carpetas con doble clic y después pulsa Guardar.</p><div class="actions"><button type="button" class="save-cancel">Cancelar</button><button class="primary">Guardar</button></div></div></form>';
  let folder='root';const name=overlay.querySelector('.save-name');name.value=img.name+'.svg';
  const list=overlay.querySelector('.save-list');
  function draw(){
    overlay.querySelector('.path').textContent=path(folder);
    overlay.querySelector('.save-back').disabled=folder==='root';list.innerHTML='';
    for(const file of children(folder)){
      const entry=document.createElement('button');entry.type='button';entry.className='file';
      entry.innerHTML=file.type==='folder'?icons.folder:file.type==='image'?assets(file.art).svg:icons.note;
      const label=document.createElement('span');label.textContent=file.name;entry.append(label);
      entry.setAttribute('aria-label',file.name+(file.type==='folder'?' · carpeta, doble clic para abrir':''));
      entry.onclick=()=>{list.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));entry.classList.add('sel');};
      function open(){if(file.type==='folder'){folder=file.id;draw();}else{name.value=file.name;}}
      entry.ondblclick=open;entry.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();open();}};
      list.append(entry);
    }
    if(!list.children.length)list.innerHTML='<p class="empty">Esta carpeta está vacía.</p>';
  }
  overlay.querySelector('.save-back').onclick=()=>{folder=byId(folder)?.parent||'root';draw();};
  overlay.querySelector('.save-home').onclick=()=>{folder='root';draw();};
  overlay.querySelector('.save-cancel').onclick=()=>overlay.hidden=true;
  overlay.querySelector('form').onsubmit=e=>{e.preventDefault();if(saveImageTo(img,folder,name.value))overlay.hidden=true;};
  draw();overlay.querySelector('.save-home').focus();
}
